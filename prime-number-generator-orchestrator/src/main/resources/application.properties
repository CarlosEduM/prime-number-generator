spring.application.name=prime-number-generator-orchestrator

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prime_number_generator}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${KAFKA_PROCESSING_RESULT_GROUP_ID:prime-number-generator-orchestrator}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.orchestrator.application.dtos.ProcessingResultUpdateDTO
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.orchestrator.application.dtos
spring.kafka.consumer.properties.spring.json.use.type.headers=false

prime-number-generator.kafka.request-topic=${KAFKA_REQUEST_TOPIC:prime-number-requests}
prime-number-generator.kafka.result-topic=${KAFKA_RESULT_TOPIC:prime-number-results}
